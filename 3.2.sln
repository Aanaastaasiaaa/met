#include <iostream>
#include <iomanip>
#include <cmath>

using namespace std;

int main() {
    setlocale(LC_ALL, "rus");
    cout << fixed << setprecision(4);
    const int n = 5;
    double alpha[6] = { 0, 0, -2, 2, 1, 3 };
    double beta[6] = { 0, 1, 4, -2, 1, -1 };
    double gamma[6] = { 0, 3, -1, 1, 1, 0 };
    double b[6] = { 0, 5, 1, 3, -2, -1 };

    double c[6]; 
    double d[6];
    double x[6];

    cout << "ПРЯМАЯ ПРОГОНКА:" << endl;

    c[2] = -gamma[1] / beta[1];
    d[2] = b[1] / beta[1];
    cout << "c2 = " << c[2] << ", d2 = " << d[2] << endl;

    double denom = alpha[2] * c[2] + beta[2];
    c[3] = -gamma[2] / denom;
    d[3] = (b[2] - alpha[2] * d[2]) / denom;
    cout << "c3 = " << c[3] << ", d3 = " << d[3] << endl;

    denom = alpha[3] * c[3] + beta[3];
    c[4] = -gamma[3] / denom;
    d[4] = (b[3] - alpha[3] * d[3]) / denom;
    cout << "c4 = " << c[4] << ", d4 = " << d[4] << endl;

    denom = alpha[4] * c[4] + beta[4];
    c[5] = -gamma[4] / denom;
    d[5] = (b[4] - alpha[4] * d[4]) / denom;
    cout << "c5 = " << c[5] << ", d5 = " << d[5] << endl;

    cout << "\nОБРАТНАЯ ПРОГОНКА:" << endl;

    x[5] = (b[5] - alpha[5] * d[5]) / (alpha[5] * c[5] + beta[5]);
    cout << "x5 = " << x[5] << endl;

    x[4] = c[5] * x[5] + d[5];
    cout << "x4 = " << x[4] << endl;

    x[3] = c[4] * x[4] + d[4];
    cout << "x3 = " << x[3] << endl;

    x[2] = c[3] * x[3] + d[3];
    cout << "x2 = " << x[2] << endl;

    x[1] = c[2] * x[2] + d[2];
    cout << "x1 = " << x[1] << endl;

    cout << "\nПРОВЕРКА ПОДСТАНОВКОЙ:" << endl;
    
    double eq1 = x[1] + 3 * x[2];
    cout << "1: " << x[1] << " + 3*" << x[2] << " = " << eq1 << " (должно быть 5)" << endl;

    double eq2 = -2 * x[1] + 4 * x[2] - x[3];
    cout << "2: -2*" << x[1] << " + 4*" << x[2] << " - " << x[3] << " = " << eq2 << " (должно быть 1)" << endl;

    double eq3 = 2 * x[2] - 2 * x[3] + x[4];
    cout << "3: 2*" << x[2] << " - 2*" << x[3] << " + " << x[4] << " = " << eq3 << " (должно быть 3)" << endl;

    double eq4 = x[3] + x[4] + x[5];
    cout << "4: " << x[3] << " + " << x[4] << " + " << x[5] << " = " << eq4 << " (должно быть -2)" << endl;

    double eq5 = 3 * x[4] - x[5];
    cout << "5: 3*" << x[4] << " - " << x[5] << " = " << eq5 << " (должно быть -1)" << endl;
}
