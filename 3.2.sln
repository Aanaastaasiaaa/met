#include <iostream>
#include <iomanip>
#include <cmath>
using namespace std;

int main() {
    setlocale(LC_ALL, "rus");
    cout << fixed << setprecision(6);

    double alpha[6] = { 0, 0, -2, 2, 1, 3 };
    double beta[6] = { 0, 1, 4, -2, 1, -1 };
    double gamma[6] = { 0, 3, -1, 1, 1, 0 };
    double b[6] = { 0, 5, 1, 3, -2, -1 };
    double c[6], d[6], x[6];

    cout << "Прямая прогонка:" << endl;
    c[2] = -gamma[1] / beta[1];
    d[2] = b[1] / beta[1];
    cout << "c2 = " << c[2] << ", d2 = " << d[2] << endl;

    c[3] = -gamma[2] / (alpha[2] * c[2] + beta[2]);
    d[3] = (b[2] - alpha[2] * d[2]) / (alpha[2] * c[2] + beta[2]);
    cout << "c3 = " << c[3] << ", d3 = " << d[3] << endl;

    c[4] = -gamma[3] / (alpha[3] * c[3] + beta[3]);
    d[4] = (b[3] - alpha[3] * d[3]) / (alpha[3] * c[3] + beta[3]);
    cout << "c4 = " << c[4] << ", d4 = " << d[4] << endl;

    c[5] = -gamma[4] / (alpha[4] * c[4] + beta[4]);
    d[5] = (b[4] - alpha[4] * d[4]) / (alpha[4] * c[4] + beta[4]);
    cout << "c5 = " << c[5] << ", d5 = " << d[5] << endl;

    cout << "\nОбратная прогонка:" << endl;

    x[5] = (b[5] - alpha[5] * d[5]) / (alpha[5] * c[5] + beta[5]);
    cout << "x5 = " << x[5] << endl;

    x[4] = c[5] * x[5] + d[5];
    cout << "x4 = " << x[4] << endl;

    x[3] = c[4] * x[4] + d[4];
    cout << "x3 = " << x[3] << endl;

    x[2] = c[3] * x[3] + d[3];
    cout << "x2 = " << x[2] << endl;

    x[1] = c[2] * x[2] + d[2];
    cout << "x1 = " << x[1] << endl;

    cout << "\nПроверка:" << endl;
    cout << "x1 + 3x2 = " << x[1] + 3 * x[2] << " (должно быть 5)" << endl;
    cout << "-2x1 + 4x2 - x3 = " << -2 * x[1] + 4 * x[2] - x[3] << " (должно быть 1)" << endl;
    cout << "2x2 - 2x3 + x4 = " << 2 * x[2] - 2 * x[3] + x[4] << " (должно быть 3)" << endl;
    cout << "x3 + x4 + x5 = " << x[3] + x[4] + x[5] << " (должно быть -2)" << endl;
    cout << "3x4 - x5 = " << 3 * x[4] - x[5] << " (должно быть -1)" << endl;
}
